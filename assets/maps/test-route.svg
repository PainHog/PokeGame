<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
  <defs>
    <pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#3f7a3f"/>
      <path d="M8 34 l4 -14 l4 14 M20 36 l4 -16 l4 16 M32 34 l4 -14 l4 14" stroke="#2f5f2f" stroke-width="3" fill="none"/>
    </pattern>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa0d8"/><stop offset="1" stop-color="#3f77b8"/>
    </linearGradient>
  </defs>

  <!-- base ground -->
  <rect width="2400" height="1600" fill="#8ec98e"/>

  <!-- dirt paths connecting the zones to the town -->
  <g fill="#d8c79a">
    <rect x="520" y="640" width="160" height="360"/>
    <rect x="1080" y="560" width="160" height="360"/>
    <rect x="1080" y="1120" width="820" height="150"/>
    <rect x="1440" y="700" width="150" height="470"/>
  </g>

  <!-- tall grass field -->
  <rect x="200" y="200" width="700" height="500" rx="18" fill="url(#grass)" stroke="#2f5f2f" stroke-width="6"/>
  <text x="550" y="175" font-family="Arial" font-size="46" font-weight="bold" fill="#204020" text-anchor="middle">Tall Grass</text>

  <!-- pond -->
  <rect x="1500" y="200" width="700" height="400" rx="60" fill="url(#water)" stroke="#2e5f92" stroke-width="6"/>
  <text x="1850" y="175" font-family="Arial" font-size="46" font-weight="bold" fill="#1c3c5c" text-anchor="middle">Pond</text>

  <!-- cave -->
  <rect x="1600" y="1000" width="600" height="450" rx="20" fill="#5a5560" stroke="#332f38" stroke-width="6"/>
  <ellipse cx="1900" cy="1225" rx="150" ry="110" fill="#2a262f"/>
  <text x="1900" y="985" font-family="Arial" font-size="46" font-weight="bold" fill="#3a3540" text-anchor="middle">Cave</text>

  <!-- town -->
  <rect x="800" y="900" width="700" height="500" rx="16" fill="#cdbd8f" stroke="#a99a70" stroke-width="6"/>
  <text x="1150" y="880" font-family="Arial" font-size="46" font-weight="bold" fill="#6a5c38" text-anchor="middle">Town</text>

  <!-- Pokémon Center -->
  <rect x="900" y="1000" width="200" height="200" rx="10" fill="#f0f0f0" stroke="#cccccc" stroke-width="4"/>
  <rect x="900" y="1000" width="200" height="70" rx="10" fill="#e0554f"/>
  <text x="1000" y="1130" font-family="Arial" font-size="60" font-weight="bold" fill="#e0554f" text-anchor="middle">+</text>
  <text x="1000" y="1250" font-family="Arial" font-size="26" fill="#444" text-anchor="middle">Center</text>

  <!-- Poké Mart -->
  <rect x="1200" y="1000" width="200" height="200" rx="10" fill="#f0f0f0" stroke="#cccccc" stroke-width="4"/>
  <rect x="1200" y="1000" width="200" height="70" rx="10" fill="#4f7fd0"/>
  <text x="1300" y="1250" font-family="Arial" font-size="26" fill="#444" text-anchor="middle">Mart</text>
</svg>
