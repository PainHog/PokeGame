name: Release

# Builds the full, installable system (compiled packs + generated maps + bundled
# sprites) and publishes it as a GitHub Release asset, so the manifest URL in
# system.json ("releases/latest/download/…") resolves to a ready-to-install ZIP.
# Build artifacts are git-ignored; this workflow is what turns the source repo
# into the distributable package.

on:
  push:
    branches: ["main", "claude/pokemon-database-access-hsd6xh"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci

      - name: Build compendium packs (+ maps)
        run: npm run build
      - name: Bundle Pokémon sprites locally (best-effort; falls back to external URLs)
        run: npm run sprites
        continue-on-error: true
      - name: Bundle trainer & NPC sprites (best-effort)
        run: npm run trainers
        continue-on-error: true
      - name: Rebuild with bundled sprites
        run: npm run build
      - name: Verify + smoke test
        run: npm run verify && npm run smoke

      - name: Package the system
        run: |
          zip -rq pokemon-masters.zip \
            system.json src styles templates lang packs assets \
            -x '*/.*'
          ls -lh pokemon-masters.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-latest
          name: "Pokémon Masters — latest build"
          body: "Auto-built installable package. Add to Foundry via the manifest URL in the README."
          prerelease: false
          files: |
            system.json
            pokemon-masters.zip
